services:
  gateway:
    build:
      context: .
      dockerfile: src/Gateway/Dockerfile
    ports:
      - "8080:8080"
    read_only: true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    environment:
      ASPNETCORE_URLS: http://+:8080
      API_BACKEND_URL: http://api:8080
    depends_on:
      api:
        condition: service_started
    networks:
      - gateway-net

  api:
    build:
      context: .
      dockerfile: src/Api/Dockerfile
    read_only: true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    environment:
      ASPNETCORE_URLS: http://+:8080
      COURSE_JWT_ISSUER: moduledev-course
      COURSE_JWT_AUDIENCE: moduledev-api
      COURSE_JWT_SIGNING_KEY: ${COURSE_JWT_SIGNING_KEY}
      COURSE_DB_CONNECTION: "Host=postgres;Port=5432;Database=course;Username=course_runtime;Password=${RUNTIME_PASSWORD};MaxPoolSize=80"
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    networks:
      - gateway-net
      - course-net

  migrator:
    build:
      context: .
      dockerfile: src/Cli/Dockerfile
    read_only: true
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    environment:
      COURSE_MIGRATION_DB_CONNECTION: "Host=postgres;Port=5432;Database=course;Username=postgres;Password=${POSTGRES_PASSWORD}"
      RUNTIME_PASSWORD: ${RUNTIME_PASSWORD}
      PUBLICATION_PASSWORD: ${PUBLICATION_PASSWORD}
      MIGRATION_PASSWORD: ${MIGRATION_PASSWORD}
    volumes:
      - ./migrations:/migrations:ro
    command: ["migration", "apply", "/migrations"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - course-net

  cli:
    build:
      context: .
      dockerfile: src/Cli/Dockerfile
    read_only: true
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    environment:
      COURSE_DB_CONNECTION: "Host=postgres;Port=5432;Database=course;Username=course_publication;Password=${PUBLICATION_PASSWORD}"
      COURSE_MIGRATION_DB_CONNECTION: "Host=postgres;Port=5432;Database=course;Username=course_migration;Password=${MIGRATION_PASSWORD}"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - course-net

  postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    environment:
      POSTGRES_DB: course
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - course-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d course"]
      interval: 2s
      timeout: 3s
      retries: 10
    networks:
      - course-net

volumes:
  course-data:

networks:
  course-net:
  gateway-net:
