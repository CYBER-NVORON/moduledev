services:
  gateway:
    build:
      context: .
      dockerfile: src/Gateway/Dockerfile
    ports:
      - "8080:8080"
    read_only: true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    environment:
      ASPNETCORE_URLS: http://+:8080
      API_BACKEND_URL: http://api:8080
    depends_on:
      api:
        condition: service_started
    networks:
      - gateway-net

  api:
    build:
      context: .
      dockerfile: src/Api/Dockerfile
    read_only: true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    environment:
      ASPNETCORE_URLS: http://+:8080
      COURSE_JWT_ISSUER: moduledev-course
      COURSE_JWT_AUDIENCE: moduledev-api
      COURSE_JWT_SIGNING_KEY: ${COURSE_JWT_SIGNING_KEY:-ThisIsALocalDevSigningKeyAtLeast32Bytes!}
      COURSE_DB_CONNECTION: "Host=postgres;Port=5432;Database=course;Username=course_runtime;Password=${RUNTIME_PASSWORD:-runtime_pass};MaxPoolSize=80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - gateway-net
      - course-net

  migrator:
    build:
      context: .
      dockerfile: src/Cli/Dockerfile
    read_only: true
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    environment:
      COURSE_MIGRATION_DB_CONNECTION: "Host=postgres;Port=5432;Database=course;Username=postgres;Password=${POSTGRES_PASSWORD:-postgres}"
      RUNTIME_PASSWORD: ${RUNTIME_PASSWORD:-runtime_pass}
      PUBLICATION_PASSWORD: ${PUBLICATION_PASSWORD:-publication_pass}
      MIGRATION_PASSWORD: ${MIGRATION_PASSWORD:-migration_pass}
      WORKER_PASSWORD: ${WORKER_PASSWORD:-worker_pass}
    command: ["migration", "apply", "/migrations"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - course-net

  cli:
    build:
      context: .
      dockerfile: src/Cli/Dockerfile
    read_only: true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    environment:
      COURSE_DB_CONNECTION: "Host=postgres;Port=5432;Database=course;Username=course_publication;Password=${PUBLICATION_PASSWORD:-publication_pass}"
      COURSE_MIGRATION_DB_CONNECTION: "Host=postgres;Port=5432;Database=course;Username=course_migration;Password=${MIGRATION_PASSWORD:-migration_pass}"
      RUNTIME_PASSWORD: ${RUNTIME_PASSWORD:-runtime_pass}
      PUBLICATION_PASSWORD: ${PUBLICATION_PASSWORD:-publication_pass}
      MIGRATION_PASSWORD: ${MIGRATION_PASSWORD:-migration_pass}
      WORKER_PASSWORD: ${WORKER_PASSWORD:-worker_pass}
      COURSE_JWT_SIGNING_KEY: ${COURSE_JWT_SIGNING_KEY:-ThisIsALocalDevSigningKeyAtLeast32Bytes!}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - course-net

  worker-a:
    image: course-worker:latest
    build:
      context: .
      dockerfile: src/Worker/Dockerfile
    read_only: true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    environment:
      COURSE_WORKER_OWNER: worker-a
      COURSE_DB_CONNECTION: "Host=postgres;Port=5432;Database=course;Username=workflow_worker;Password=${WORKER_PASSWORD:-worker_pass}"
      COURSE_TEST_PROFILE: "${COURSE_TEST_PROFILE:-}"
      COURSE_FAILPOINT: "${COURSE_FAILPOINT:-}"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - course-net

  worker-b:
    image: course-worker:latest
    build:
      context: .
      dockerfile: src/Worker/Dockerfile
    read_only: true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    environment:
      COURSE_WORKER_OWNER: worker-b
      COURSE_DB_CONNECTION: "Host=postgres;Port=5432;Database=course;Username=workflow_worker;Password=${WORKER_PASSWORD:-worker_pass}"
      COURSE_TEST_PROFILE: "${COURSE_TEST_PROFILE:-}"
      COURSE_FAILPOINT: "${COURSE_FAILPOINT:-}"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - course-net

  postgres:
    build:
      context: .
      dockerfile: src/Postgres/Dockerfile
    environment:
      POSTGRES_DB: course
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      RUNTIME_PASSWORD: ${RUNTIME_PASSWORD:-runtime_pass}
      PUBLICATION_PASSWORD: ${PUBLICATION_PASSWORD:-publication_pass}
      MIGRATION_PASSWORD: ${MIGRATION_PASSWORD:-migration_pass}
      WORKER_PASSWORD: ${WORKER_PASSWORD:-worker_pass}
    volumes:
      - course-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d course"]
      interval: 2s
      timeout: 3s
      retries: 10
    networks:
      - course-net

volumes:
  course-data:

networks:
  course-net:
  gateway-net:
